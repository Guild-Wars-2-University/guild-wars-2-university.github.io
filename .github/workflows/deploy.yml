name: Quartz reader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          path: content-source
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare content
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          rsync -a \
            --exclude='.git' \
            --exclude='.obsidian' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.DS_Store' \
            --exclude='discordemojipicker' \
            --exclude='sources' \
            content-source/ quartz/content/

      - name: Install Dependencies
        working-directory: ./quartz
        run: npm ci

      - name: Configure Quartz
        working-directory: ./quartz
        run: |
          sed -i 's|pageTitle: .*|pageTitle: "Guild Wars University Library",|' quartz.config.ts
          sed -i 's|baseUrl: .*|baseUrl: "guild-wars-2-university.github.io/gw2-university-resources",|' quartz.config.ts

      - name: Build Quartz
        working-directory: ./quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

